# Two-level landmark taxonomy, derived from Wikidata instance tags.
#
# Resolution order for a single tag (see src/preprocess/taxonomy.py):
#   1. non_landmark_tags / non_landmark_heads -> row is not a landmark
#   2. classification_tags                    -> orthogonal ranking, not a type
#   3. tag_overrides (full tag string)        -> fine label
#   4. synonyms (head noun)                   -> fine label
#   5. bare head noun                         -> fine label
#   then fine_to_coarse -> coarse bucket. Unmapped fine labels are reported, not silently bucketed.
#
# Country-neutral by design. Adding a country should mean adding entries to
# `synonyms` (its loanwords) and `tag_overrides` (its head-noun collisions) --
# not editing code.

# ---------------------------------------------------------------------------
# Rows that are not landmarks at all. These are data errors currently hiding
# inside `other`: Wikimedia plumbing, unresolved Q-IDs, administrative units.
# ---------------------------------------------------------------------------
non_landmark_heads:
  # Wikimedia / data plumbing
  - category            # "Wikimedia category"
  - page                # "Wikimedia disambiguation page"
  - database
  - snapshot
  # Administrative divisions -- the entity *is* the unit, not a landmark in it
  - city
  - town
  - village
  - ward
  - prefecture
  - province
  - subprefecture
  - capital
  - division
  - ōaza
  - chōchō
  - territory
  - region
  - settlement
  - colony
  - kokufu
  - municipality
  # Historic capitals / named places -- the entity is the settlement itself
  - heian-kyō
  - nagaoka-kyō
  - asuka
  - kyushu
  - shikoku
  - nikkō-shi
  - tsuruga
  - murone
  - shōnai-machi
  # Countries / polities
  - japan
  - korea
  - taiwan
  - republic
  - nations
  # Organisations & abstractions (not physical places)
  - organization
  - company
  - business
  - brand
  - team
  - broadcaster
  - publisher
  - retailer
  - gaisha              # "kabushiki gaisha"
  - agency
  - ministry
  - government
  - network
  - itinerary
  - age
  - japonic
  - object              # "mythical object"
  # Numeric collection nouns ("dyad", "triad", ... ) -- Wikidata grouping cruft
  - monad
  - dyad
  - triad
  - tetrad
  - pentad
  - hexad
  - heptad
  - octad

# Unresolved Wikidata Q-IDs are matched by pattern (^q\d+$) in code, not listed here.

# ---------------------------------------------------------------------------
# Orthogonal classifications: shrine *ranking* systems, not physical types.
# Verified against the corpus: every one of these co-occurs with "Shinto shrine"
# 100% of the time. Left in place they would form large bogus categories
# (Shikinaisha alone is 224 tag occurrences).
# Preserved on the row in `classification_tags` rather than discarded.
# ---------------------------------------------------------------------------
classification_heads:
  - shikinaisha
  - ronsha              # "Shikinai Ronsha"
  - shikigesha
  - shikigeisha
  - kanpei-sha
  - kokuhei-sha
  - shokan-sha
  - chokusaisha
  - genzaisha           # "kokushi genzaisha"
  - sōja
  - offerings           # "Shrines receiving Tsukinami-sai and Niiname-sai offerings"
  - offering
  - quiver              # "Shrine receiving Hoe and Quiver"
  - tradition           # "Shinto shrines by tradition"
  - betsu-gū
  - pilgrimage          # membership in a route, not a type; co-occurs with temple
  - gōshi               # 郷社, "village shrine" rank -- NOT the rural-samurai sense

# ---------------------------------------------------------------------------
# Structural nouns that sit at the head while the *modifier* carries the type:
# "church building", "museum building", "station building". For these the
# resolver prefers the modifier, falling back to the head when the modifier
# names nothing known ("commercial complex", "government building").
#
# Country-neutral: the same shape covers "temple complex", "mosque building".
# ---------------------------------------------------------------------------
generic_structural_heads:
  - building
  - complex
  - structure
  - facility
  - ensemble
  - construction

# ---------------------------------------------------------------------------
# Low-information fine labels. An entity's primary label is otherwise the
# rarest of its tags (rare == specific == informative), but these labels break
# that assumption: they are semantically vague *and* statistically rare, so
# plain IDF lets them beat a real type. "tourist attraction" outranked a castle
# keep on Atami Castle; generic "building" outranks "museum".
#
# These only win when an entity has nothing else.
# ---------------------------------------------------------------------------
low_information_fine:
  - tourist_attraction
  - building
  - heritage_designation
  - natural_feature
  - protected_area

# ---------------------------------------------------------------------------
# Full-tag overrides. These exist because the head noun is genuinely ambiguous
# across categories -- head-noun extraction cannot split them.
# Checked BEFORE the head-noun path.
# ---------------------------------------------------------------------------
tag_overrides:
  # Generic "this is a notable thing" tags. Distinct from visitor_facility,
  # which is a real type (michi-no-eki, visitor centre).
  tourist attraction: tourist_attraction
  architectural landmark: tourist_attraction
  natural monument: heritage_designation      # 天然記念物 -- a designation on a
                                              # tree or rock, not a built monument
  architectural heritage monument: heritage_designation
  national treasure of japan: heritage_designation
  cultural heritage: heritage_designation
  # head "range": natural feature vs sports facility
  mountain range: mountain
  shooting range: sports_facility

  # head "block": administrative vs structure
  city block: __non_landmark__
  tower block: tower

  # head "center"/"centre": culture vs civic vs retail
  arts center: arts_venue
  performing arts center: arts_venue
  cultural center: arts_venue
  community center: civic_building
  convention center: convention_facility
  swimming center: sports_facility
  recreation center: sports_facility
  leisure center: sports_facility
  shopping center: retail
  family entertainment center: amusement
  information centre: visitor_facility
  visitor center: visitor_facility
  buried cultural property center: museum
  space center: research_facility
  korean cultural center branch office: arts_venue

  # head "hall": civic vs culture vs commercial
  city hall: civic_building
  village hall: civic_building
  concert hall: arts_venue
  dance hall: arts_venue
  conference hall: convention_facility
  function hall: convention_facility
  multi-purpose hall: convention_facility
  hall: convention_facility
  main hall: temple            # Buddhist "main hall" (hondō)

  # head "site": archaeology vs burial vs generic heritage label
  archaeological site: archaeological_site
  group of archaeological sites: archaeological_site
  historic site: archaeological_site
  heritage site: heritage_designation
  industrial heritage site: factory
  pilgrimage site: shrine
  imperial mausoleum/tomb reference site: mausoleum

  # People appearing in an instance-tag field -- upstream data corruption.
  # Each is rescued by a co-occurring "biographical museum" tag, so they never
  # block a row; they surface only in the shadowed-heads report.
  osamu dazai: __non_landmark__
  mitsukuri genpo: __non_landmark__
  tomitaro makino: __non_landmark__

  # Long-tail singletons whose head noun carries no type
  japan national route 354: road
  multifamily residential: house
  step pyramid: monument
  green roof: garden
  urban renewal: district
  polling place: civic_building

  # head "park": green space vs industrial/business estate
  science park: research_facility
  business park: office_building
  railway park: park
  traffic park: park

  # head "station": transport vs power generation vs roadside rest vs POST TOWN.
  # The last one is a trap: "station of the Tōkaidō" is an Edo-period shukuba,
  # not a railway station, and the trailing-phrase strip hides that.
  station of the tōkaidō: district
  69 stations of the nakasendō: district
  roadside station: visitor_facility          # michi-no-eki
  hydroelectric power station: power_station
  pumped-storage power station: power_station
  coal-fired power station: power_station
  oil-fired power station: power_station
  pumping station: waterworks
  ground station: transport_facility
  former bus station: transport_facility

  # head "group": the trailing-phrase strip leaves a bare "group", losing the
  # noun that actually carries the type.
  group of lakes: lake
  group of archaeological sites: archaeological_site
  group of sculptures: sculpture
  island group: island
  volcanic group: volcano
  # A bare "group" says nothing about type. That is a gap, not grounds to call
  # the row a non-landmark -- Hashiguiiwa, tagged only "group", is a well-known
  # rock formation. Report it instead of asserting.
  group: __unmapped__

  # head "general"
  consulate general: office_building

  # head "house"/"home": dwelling vs venue vs commerce
  opera house: arts_venue
  guest house: lodging
  tea house: tea_house
  revenue house: civic_building
  pawnshop: retail
  detention house in japan: prison

  # head "tower": structure vs mining headframe
  elevator test tower: tower
  transmitter mast: tower

  # head "island": landform vs engineered
  artificial island: artificial_island

  # head "lake"/"pond": natural vs engineered
  artificial lake: reservoir
  artificial pond: reservoir
  artificial hill: park

  # head "clock": monument vs instrument
  floral clock: monument
  water clock: monument

  # head "arch": a natural arch is a rock formation, not a built gate. GeoTIR's
  # "arch_gate" conflated the two; keeping that would put Engetsu Island (a sea
  # arch) in the same bucket as temple gates.
  natural arch: rock_formation

  # head "area": highway rest stops are facilities, not districts
  service area: visitor_facility
  rest area: visitor_facility

  # head "venue": default is sports (most venue tags here are), so the
  # cultural ones need calling out
  arts venue: arts_venue
  music venue: arts_venue

  # head "building": modifier names no known type, so the generic-structural
  # rule cannot rescue these
  religious building: religious_building
  structure of worship: religious_building
  bank building: office_building

  # "fixed construction" is a flood-memorial stone in this corpus
  fixed construction: monument

  # head "work": art vs generic
  work of art: sculpture

  # Ships -- preserved vessels are museum-like, not infrastructure
  museum ship: museum
  preserved watercraft: museum

  # Natural features whose head noun is a proper name in this corpus
  hometown fuji: mountain        # local peaks resembling Mt. Fuji
  meoto iwa: rock_formation
  special-looking rocks: rock_formation
  urami waterfall: waterfall
  48 waterfalls: waterfall

  # Rathaus = German town hall; kept to prove the config is not Japan-only
  rathaus: civic_building

